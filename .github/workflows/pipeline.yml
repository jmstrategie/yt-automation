name: YouTube Automation Pipeline

on:
  schedule:
    - cron: "0 14 * * 1,3,5"
    - cron: "0 16 * * 2,4,6"
  workflow_dispatch:
    inputs:
      channel:
        description: "Which channel to run"
        required: true
        default: "A"
        type: choice
        options:
          - A
          - B
          - both
      dry_run:
        description: "Dry run only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: pip install -r requirements.txt python-dotenv

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          curl -sL "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Bold.ttf" -o assets/fonts/Roboto-Bold.ttf
          curl -sL "https://github.com/googlefonts/roboto/raw/main/src/hinted/Roboto-Regular.ttf" -o assets/fonts/Roboto-Regular.ttf

      - name: Write secrets
        run: |
          mkdir -p secrets
          echo '${{ secrets.CLIENT_SECRETS_CHANNEL_A }}' > secrets/client_secrets_channelA.json
          echo '${{ secrets.TOKEN_CHANNEL_A }}' > secrets/token_channelA.json

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          CHANNEL="${{ github.event.inputs.channel }}"
          if [ -z "$CHANNEL" ]; then
            CHANNEL="A"
          fi
          python pipeline.py --channel $CHANNEL $DRY_FLAG
